[workspace]
name = "dexim-core"
channels = ["conda-forge"]
# Keep local development solve scoped to the current platform.
platforms = ["win-64"]

[dependencies]
python = "3.10.*"
pip = ">=24"
pinocchio = ">=3.7.0"

[pypi-dependencies]
# Install current package in editable mode inside the Pixi environment.
dexim-core = { path = ".", editable = true }

[tasks]
check-import = "python -c \"import pinocchio; import dexim.core; print('pinocchio + dexim.core import ok')\""
