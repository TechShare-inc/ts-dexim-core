[build-system]
requires = ["setuptools>=72"]

[project]
name = "dexim-core"
version = "0.1.0"
description = "DexImitate core framework modules consolidated into one package"
readme = "README.md"
authors = [
    { name = "haoyan.li", email = "haoyan.li@techshare.co.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.0",
    "msgpack>=1.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pyzmq>=25.0.0",
    "scipy>=1.10.0",
    "viser>=1.0.24",
    "nlopt>=2.7.0",
]

[tool.pyright]
stubPath = "typings"

[tool.setuptools.packages.find]
where = ["src"]
# Enable namespace package discovery so dexim.core co-exists with dexim.nova etc.
namespaces = true
