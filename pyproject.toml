[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[project]
name = "dexim-core"
version = "0.1.0"
description = "DexImitate core framework modules consolidated into one package"
readme = "README.md"
authors = [
    { name = "haoyan.li", email = "haoyan.li@techshare.co.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.0",
    "msgpack>=1.0.0",
    "numpy>=2.2.0",
    "pyyaml>=6.0",
    "pyzmq>=26.0.0",
    "scipy>=1.10.0",
    "viser>=1.0.24",
    "nlopt>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.pyright]
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.uv.build-backend]
module-name = "dexim.core"
namespace = true

[tool.pixi.workspace]
name = "dexim-core"
channels = ["conda-forge"]
# Keep local development solve scoped to the current platform.
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.10.*"
pip = ">=24"
pinocchio = ">=3.7.0"

[tool.pixi.pypi-dependencies]
# Install current package in editable mode inside the Pixi environment.
dexim-core = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.tasks]
check-import = "python -c \"import pinocchio; import dexim.core; print('pinocchio + dexim.core import ok')\""
test = "pytest"
lint = "ruff check src tests"
format-check = "ruff format --check src tests"
